services:
  db:
    image: postgres:16-alpine
    container_name: revenuemind-pricing-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricing_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenuemind-pricing-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pricing_db}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_AUTH_BYPASS: "true"
        NEXT_PUBLIC_USE_REAL_API: "false"
    container_name: revenuemind-pricing-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
